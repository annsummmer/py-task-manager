{% extends "base.html" %}

{% block content %}
  <div class="page-header">
    <h1>{{ entity|capfirst }} list</h1>
    <a href="{% url 'tasks:'|add:url_prefix|add:'-create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Create</a>
  </div>
  {% include "includes/search.html" %}
  <div class="card"><div class="card-body">
    {% if object_list %}
      <table class="table table-hover mb-0">
        <thead><tr><th>Name</th><th></th></tr></thead>
        <tbody>
          {% for obj in object_list %}
            <tr>
              <td>{{ obj.name }}</td>
              <td class="text-right">
                <a href="{% url 'tasks:'|add:url_prefix|add:'-update' pk=obj.pk %}" class="btn btn-sm btn-outline-secondary">Update</a>
                <a href="{% url 'tasks:'|add:url_prefix|add:'-delete' pk=obj.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="text-muted mb-0">There are no {{ entity }}s.</p>
    {% endif %}
  </div></div>
{% endblock %}
