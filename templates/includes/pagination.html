{% load query_transform %}
{% if is_paginated %}
  <nav aria-label="Pagination">
    <ul class="pagination justify-content-center mt-4">
      {% if page_obj.has_previous %}
        <li class="page-item">
          <a href="?{% query_transform page=page_obj.previous_page_number %}" class="page-link">&laquo; prev</a>
        </li>
      {% endif %}
      <li class="page-item active">
        <span class="page-link">{{ page_obj.number }} of {{ paginator.num_pages }}</span>
      </li>
      {% if page_obj.has_next %}
        <li class="page-item">
          <a href="?{% query_transform page=page_obj.next_page_number %}" class="page-link">next &raquo;</a>
        </li>
      {% endif %}
    </ul>
  </nav>
{% endif %}
